name: Deploy static edition to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static edition (no secrets used)
        run: node scripts/build-static.js
        env:
          SITE_URL: https://luxthorley.github.io/luxprime-ai-chef/
      - name: Secret scan of build output
        run: "! grep -rEl 'eyJhb[G]ci|sk_(l[i]ve|t[e]st)_[A-Za-z0-9]{10,}' dist"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
